<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Vedanta Makeathon | Official Event & Registration Portal</title>
  <meta name="description"
    content="Official portal for Vedanta Makeathon. Register your team, check phase timelines, submit project documents, and access team workspace." />
  <meta name="keywords"
    content="Vedanta Makeathon, Makeathon, Ideathon, Hackathon, VTU, Engineering Competition, Registration" />
  <meta name="author" content="Vedanta Makeathon" />
  <meta name="robots" content="index, follow" />
  <meta name="google-site-verification" content="jSY6XP3bOW-RnaUMUbiCoP0vu0s4bFqhWFsTJEtH-h8" />

  <!-- Force Android Chrome & mobile browser navigation/status bars to solid black -->
  <meta name="theme-color" content="#000000" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#000000" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-capable" content="yes" />

  <!-- Ensure viewport fills screen including iOS/Android gesture/nav bar safe areas -->
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <!-- Favicon & Touch Icons -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512x512.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="canonical" href="https://vedanta-makeathon.vercel.app/" />

  <!-- Open Graph / Social Media Meta Tags -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://vedanta-makeathon.vercel.app/" />
  <meta property="og:title" content="Vedanta Makeathon | Official Event Portal" />
  <meta property="og:description"
    content="Register your team, check phase timelines, submit project documents, and access team workspace." />
  <meta property="og:image" content="https://vedanta-makeathon.vercel.app/og-image-v2.webp" />
  <meta property="og:site_name" content="Vedanta Makeathon" />
  <meta property="og:locale" content="en_IN" />

  <!-- Structured Event Schema (JSON-LD) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Event",
    "name": "Vedanta Makeathon",
    "url": "https://vedanta-makeathon.vercel.app/",
    "description": "National level engineering makeathon and ideathon.",
    "eventStatus": "https://schema.org/EventScheduled",
    "eventAttendanceMode": "https://schema.org/MixedEventAttendanceMode"
  }
  </script>

  <!-- Resource hints: pre-warm connections to external image/video CDNs -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet">
  <!-- Preload LCP hero image -->
  <link rel="preload" as="image" href="/ArticleImages/dakshinamurthy-a2.webp" type="image/webp" />
